# Render Blueprint: DiffMate on free plans, $0 (docs/PLAN.md Phase 6, docs/runbooks/deploy.md).
# Secrets are `sync: false`: Render asks for them once, in its dashboard. Never put values here.
services:
  - type: web
    name: diffmate
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: ./start.sh # migrations, then API + review worker in one container
    # "/" is a static page. Never /health here: it wakes the Neon database, and Neon's free
    # plan allows 100 compute-hours a month.
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL # Neon, direct (not pooled) endpoint: postgresql+asyncpg://...?ssl=require
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: diffmate-redis
          property: connectionString
      - key: PUBLIC_API_URL # this service's own address, e.g. https://diffmate.onrender.com
        sync: false
      - key: FRONTEND_ORIGIN # the same address as PUBLIC_API_URL
        sync: false
      - key: FRONTEND_DIST
        value: /app/frontend-dist
      # CLIENT_IP_HEADER: the default (cf-connecting-ip) is right on Render. Tested 2026-10-21:
      # Cloudflare in front of Render rejects a client-sent CF-Connecting-IP (error 1000), and the
      # dashboard limit allowed exactly 60 requests a minute, then 429 (docs/threat-model.md #4).
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY # the PEM itself; one line with \n is fine
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY # from a Google project with no billing account (ADR 0003)
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_DAILY_REQUEST_CAP
        value: "400"
      - key: LLM_REQUESTS_PER_MINUTE
        value: "12"
      # Live demo (optional): a public sandbox repo with DiffMate installed, and a fine-grained
      # token for that repo only (contents and pull requests: write). Unset = no live demo.
      - key: DEMO_REPO
        sync: false
      - key: DEMO_TOKEN
        sync: false
      - key: DEMO_DAILY_CAP
        value: "10"
      - key: DEMO_EXAMPLES_FILE
        value: /app/demo.json

  - type: keyvalue
    name: diffmate-redis
    plan: free
    region: oregon
    ipAllowList: [] # no outside access: only services in this Render account can connect
    maxmemoryPolicy: noeviction # never silently drop queued jobs or sessions
